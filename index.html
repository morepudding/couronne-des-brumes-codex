<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <title>La Couronne des Brumes — Codex</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#11100d;color:#efe4cf;font-family:Georgia,serif;overflow:hidden}
    button{font:inherit}
    a{font:inherit}
    #app{width:100%;height:100%;position:relative;background:#17130e}
    header{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 24px;background:linear-gradient(#090806d9,transparent);pointer-events:none}
    header>*{pointer-events:auto}
    .brand{border:0;background:0;color:#efe4cf;text-align:left;cursor:pointer}
    .k{display:block;font:10px Arial;letter-spacing:.25em;color:#c9a66b;margin-bottom:5px}
    .title{font-size:clamp(21px,2.4vw,36px);text-shadow:0 2px 12px #000}
    .tools{display:flex;gap:7px;align-items:center}
    .tools button,.summary-link{height:38px;border:1px solid #dcc59d3d;background:#100e0bbd;color:#efe4cf;padding:0 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
    .tools button:hover,.summary-link:hover{background:#c9a66b2e}
    #stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#100e0b}
    #stage.drag{cursor:grabbing}
    #stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 68%,#09080644 100%)}
    #scene{position:absolute;left:50%;top:52%;width:min(94vw,117vh,1500px);aspect-ratio:1447/1087;transform-origin:center;user-select:none;will-change:transform}
    #scene img{width:100%;height:100%;display:block;object-fit:contain;filter:saturate(.98) contrast(1.02) brightness(1.08);box-shadow:0 18px 70px #0008}
    .m{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:8;display:flex;align-items:center;gap:8px;border:0;background:0;color:#201b14;padding:9px;cursor:pointer}
    .m i{width:13px;height:13px;border-radius:50%;background:#754a28;border:2px solid #ead4a3;box-shadow:0 0 0 4px #301e1159,0 2px 10px #0008}
    .m span{font-weight:700;white-space:nowrap;background:#eadbb8e8;border:1px solid #3e2b1966;padding:4px 8px;border-radius:3px;box-shadow:0 2px 8px #0003}
    .m.lock{opacity:.52}.m.lock i{background:#5c554b;border-style:dashed}.m.myst i{background:#475052;border-color:#cad1cc}.m:hover i{transform:scale(1.35)}
    .hint{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);font:11px Arial;background:#0d0c0aa8;border:1px solid #dcc59d24;padding:8px 12px;color:#efe4cfbd;backdrop-filter:blur(7px)}
    aside{position:fixed;z-index:40;top:0;bottom:0;width:min(430px,92vw);background:#12100ced;border-left:1px solid #dcc59d3d;backdrop-filter:blur(14px);transition:transform .28s ease;overflow:auto}
    #detail{right:0;transform:translateX(102%)}#detail.open{transform:none}
    #index{left:0;transform:translateX(-102%);border-left:0;border-right:1px solid #dcc59d3d;padding:26px}#index.open{transform:none}
    .close{position:absolute;top:15px;right:15px;width:38px;height:38px;border-radius:50%;border:1px solid #efe4cf40;background:#0a0907b0;color:#efe4cf;font-size:24px;cursor:pointer}
    .art{height:160px;background:radial-gradient(circle at 30% 35%,#cfbe9e2e,transparent 32%),linear-gradient(145deg,#594f4252,#181612e0);border-bottom:1px solid #dcc59d3d}
    .content{padding:26px 28px}.meta{font:10px Arial;letter-spacing:.2em;text-transform:uppercase;color:#c9a66b;margin-bottom:10px}h1,h2{font-weight:500}h1{font-size:42px;line-height:1;margin:0 0 12px}h2{font-size:34px;margin:4px 0 22px}.lead{font-size:18px;line-height:1.45;color:#eadfc9}.body{font-size:14px;line-height:1.65;color:#c9bdab}.status{margin-top:20px;padding-top:16px;border-top:1px solid #dcc59d3d;font:11px Arial;color:#ad9f8b}
    .idx{display:grid;gap:8px}.idx button{width:100%;text-align:left;border:1px solid #dcc59d3d;background:#ffffff05;color:#efe4cf;padding:14px 15px;cursor:pointer}.idx button:hover{background:#c9a66b2e}.note{margin-top:20px;padding-top:16px;border-top:1px solid #dcc59d3d;font-size:12px;line-height:1.55;color:#aa9d8b}
    @media(max-width:760px){header{padding:15px}.tools #idxBtn{display:none}.summary-link{font-size:12px;padding:0 9px}#scene{width:135vw}.m span{font-size:12px}.hint{width:calc(100% - 24px);text-align:center}}
  </style>
</head>
<body>
  <main id="app">
    <header>
      <button class="brand" id="brand"><span class="k">CODEX 0.1</span><span class="title">La Couronne des Brumes</span></button>
      <div class="tools">
        <a class="summary-link" href="/resume.html">Résumé</a>
        <button id="idxBtn">Index</button>
        <button id="minus">−</button>
        <button id="plus">+</button>
        <button id="reset">Vue monde</button>
      </div>
    </header>
    <section id="stage">
      <div id="scene">
        <img alt="Carte du monde connu" src="/world-map.jpg">
        <button class="m" style="--x:43.4%;--y:57%" data-p="veyren"><i></i><span>Veyren</span></button>
        <button class="m" style="--x:33.5%;--y:75%" data-p="veyre"><i></i><span>Veyre</span></button>
        <button class="m" style="--x:20.3%;--y:40.5%" data-p="marches"><i></i><span>Les Marches</span></button>
        <button class="m myst" style="--x:10.7%;--y:65%" data-p="couronne"><i></i><span>La Couronne</span></button>
        <button class="m myst" style="--x:22.8%;--y:80.6%" data-p="ile"><i></i><span>Île apparue</span></button>
        <button class="m lock" style="--x:55.5%;--y:23.7%" data-p="nord"><i></i><span>Nord industriel</span></button>
        <button class="m lock" style="--x:73.1%;--y:37.6%" data-p="republique"><i></i><span>République de l’Est</span></button>
        <button class="m lock" style="--x:91.8%;--y:22%" data-p="odren"><i></i><span>Odren</span></button>
      </div>
      <div class="hint">Glisser pour déplacer · molette ou boutons pour zoomer · cliquer pour explorer</div>
    </section>
    <aside id="detail">
      <button class="close" id="close">×</button><div class="art"></div>
      <div class="content"><div class="meta" id="meta"></div><h1 id="pt"></h1><p class="lead" id="lead"></p><div class="body" id="body"></div><div class="status" id="status"></div></div>
    </aside>
    <aside id="index">
      <button class="close" id="iclose">×</button><span class="k">INDEX DU CODEX</span><h2>Monde publié</h2><nav class="idx" id="ilist"></nav><p class="note">Le Codex ne publie que les éléments suffisamment stabilisés. Les zones en pointillés existent sur la carte, mais leur fiche reste volontairement fermée.</p>
    </aside>
  </main>
  <script>
    (()=>{
      const P={
        veyren:['Veyren','Lieu canon · Capitale maritime','Une capitale plus vieille que les dynasties qui la gouvernent, accumulée en couches autour d’une immense baie.','Dense, populaire, bruyante et profondément tournée vers la mer, Veyren est le cœur de la vieille puissance maritime. Son véritable symbole de puissance n’est pas le palais mais l’Arsenal. Le Courant y fait partie de la vie quotidienne.',1],
        veyre:['Veyre','Lieu canon · Frontière de la Couronne','Une cité maritime ancienne bâtie au contact des falaises, des marées, des vents violents et de la Couronne.','Veyre vit avec la Couronne depuis assez longtemps pour avoir transformé le danger en habitudes. Au début du récit, son phare s’éteint. Le gardien disparaît. Le mécanisme continue pourtant de fonctionner sous la falaise.',1],
        marches:['Les Marches','Lieu canon · Archipels occidentaux','Là où l’autorité des grands États devient intermittente et où la civilisation peut s’arrêter quelques rues après le port.','Ports improvisés, petites colonies, compagnies privées, contrebandiers, mercenaires et communautés isolées composent une frontière maritime fragmentée.',1],
        couronne:['La Couronne','Mystère canon · Limite du monde navigable','Une ceinture de brumes et de tempêtes marque la limite supposée du monde navigable.','Sa nature exacte reste inconnue. Le Codex s’arrête volontairement ici : ce qui existe au-delà n’est pas publié.',1],
        ile:['L’île apparue','Événement canon · Déclencheur','Au matin suivant l’extinction du phare de Veyre, une île inconnue apparaît à l’horizon.','Elle n’existait sur aucune carte connue. Son apparition transforme une panne locale en question beaucoup plus large.',1],
        nord:['Puissance industrielle du Nord','Présence cartographique · Fiche non publiée','Cette puissance existe sur la carte validée, mais son identité détaillée n’est pas encore publiée dans le Codex.','Les éléments en développement restent volontairement hors de cette édition.',0],
        republique:['République marchande de l’Est','Présence cartographique · Fiche non publiée','Cette puissance existe sur la carte validée, mais sa fiche reste fermée tant que son canon n’est pas suffisamment stabilisé.','Le Codex n’expose pas les variantes de travail.',0],
        odren:['Odren','Présence cartographique · Fiche non publiée','Odren appartient à une aire maritime plus lointaine. Sa présence sur la carte est validée ; sa fiche complète n’est pas encore publiée.','Les détails d’auteur restent dans l’atelier tant qu’une publication explicite du Canon n’a pas été faite.',0]
      };
      const st=document.querySelector('#stage'),sc=document.querySelector('#scene'),d=document.querySelector('#detail'),ix=document.querySelector('#index');
      const meta=document.querySelector('#meta'),pt=document.querySelector('#pt'),lead=document.querySelector('#lead'),body=document.querySelector('#body'),status=document.querySelector('#status');
      let z=1,x=0,y=0,drag=0,pid,sx,sy,bx,by;
      const tr=()=>{let mx=Math.max(0,(sc.offsetWidth*z-st.clientWidth)*.45+150),my=Math.max(0,(sc.offsetHeight*z-st.clientHeight)*.45+110);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y));sc.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${z})`};
      const zoom=a=>{z=Math.min(2.65,Math.max(.86,z+a));tr()};
      const reset=()=>{z=1;x=y=0;tr()};
      st.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?.12:-.12)};
      st.onpointerdown=e=>{if(e.target.closest('button,aside'))return;drag=1;pid=e.pointerId;sx=e.clientX;sy=e.clientY;bx=x;by=y;st.setPointerCapture(pid);st.classList.add('drag')};
      st.onpointermove=e=>{if(!drag||e.pointerId!==pid)return;x=bx+e.clientX-sx;y=by+e.clientY-sy;tr()};
      st.onpointerup=st.onpointercancel=e=>{if(!drag||e.pointerId!==pid)return;drag=0;st.classList.remove('drag')};
      const open=k=>{let p=P[k];meta.textContent=p[1];pt.textContent=p[0];lead.textContent=p[2];body.innerHTML='<p>'+p[3]+'</p>';status.innerHTML='<strong>'+(p[4]?'Publié':'Fermé')+'</strong><br>'+(p[4]?'Canon publié · fiche V1':'Non publié · développement en cours');d.classList.add('open');ix.classList.remove('open')};
      document.querySelectorAll('.m').forEach(b=>b.onclick=e=>{e.stopPropagation();open(b.dataset.p)});
      document.querySelector('#close').onclick=()=>d.classList.remove('open');
      document.querySelector('#plus').onclick=()=>zoom(.2);document.querySelector('#minus').onclick=()=>zoom(-.2);document.querySelector('#reset').onclick=document.querySelector('#brand').onclick=reset;
      document.querySelector('#idxBtn').onclick=()=>{ix.classList.add('open');d.classList.remove('open')};
      document.querySelector('#iclose').onclick=()=>ix.classList.remove('open');
      const ilist=document.querySelector('#ilist');ilist.innerHTML=Object.keys(P).filter(k=>P[k][4]).map(k=>`<button data-k="${k}">${P[k][0]}</button>`).join('');ilist.querySelectorAll('button').forEach(b=>b.onclick=()=>open(b.dataset.k));
      window.onresize=tr;tr();
    })();
  </script>
</body>
</html>
