<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 990" role="img" aria-labelledby="title desc">
  <title id="title">Carte stylisée du monde connu</title>
  <desc id="desc">Une mer sombre entourée de terres, d'archipels et d'une ceinture de brumes.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18242b"/>
      <stop offset="0.55" stop-color="#27363a"/>
      <stop offset="1" stop-color="#121b20"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79c70"/>
      <stop offset="1" stop-color="#6d604c"/>
    </linearGradient>
    <linearGradient id="landDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c7a5a"/>
      <stop offset="1" stop-color="#4d493e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#d6c18a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d6c18a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="waves" width="120" height="76" patternUnits="userSpaceOnUse">
      <path d="M4 18c18-10 36-10 54 0s36 10 58 0M-24 52c18-10 36-10 54 0s36 10 58 0" fill="none" stroke="#afc4c0" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="1320" height="990" fill="url(#sea)"/>
  <rect width="1320" height="990" fill="url(#waves)" opacity=".75"/>
  <ellipse cx="360" cy="570" rx="350" ry="470" fill="url(#glow)"/>

  <!-- Northern industrial coast -->
  <path d="M535 42c68-24 130 4 188 2 51-2 94-28 151-8l84 56-16 82-55 45-27 77-83 41-83-25-56 35-82-46-31-81 30-61z" fill="url(#landDark)" stroke="#d6bd8a" stroke-opacity=".5" stroke-width="4"/>
  <path d="M576 104c58 12 91 6 142-20M681 79l35 55 69 18M594 208l85-41 86 49" fill="none" stroke="#d8c394" stroke-opacity=".25" stroke-width="3"/>

  <!-- Western archipelagos -->
  <path d="M112 240l57-25 55 31-16 51-47 18-51-28zM245 176l49-20 34 37-19 46-54 6-28-33zM139 390l73-34 64 34-18 62-58 19-63-33zM288 338l42-26 55 27-6 45-49 20-43-25zM84 535l58-31 55 31-9 61-63 16-48-37z" fill="url(#landDark)" stroke="#cbb27f" stroke-opacity=".62" stroke-width="4"/>
  <path d="M126 266l65-2M164 411l80-2M101 555l83 2M278 200l42 7M302 348l44 8" stroke="#eee0b7" stroke-opacity=".22" stroke-width="3"/>

  <!-- Central maritime power -->
  <path d="M359 345l85-38 91 20 54 67-19 77 47 71-22 108-72 84-92-5-48-59-89-23-30-95 39-75-12-67z" fill="url(#land)" stroke="#e4c88f" stroke-opacity=".72" stroke-width="5"/>
  <path d="M395 364l57 49-15 77 65 35 13 81-60 56M485 325l-18 77 48 42 73-14M319 509l84-19 54 58-19 84M343 661l83-38 95 33" fill="none" stroke="#4c4b42" stroke-opacity=".58" stroke-width="4"/>
  <path d="M529 487c22-21 47-29 78-25M508 584c33 8 61 5 96-12" fill="none" stroke="#eed7a1" stroke-opacity=".28" stroke-width="3"/>

  <!-- Southern islands and the newly appeared island -->
  <path d="M278 748l51-19 46 32-13 50-48 22-45-34zM374 816l50-28 48 28-6 53-49 21-47-31zM207 846l39-22 36 26-8 39-39 19-34-24z" fill="url(#landDark)" stroke="#d8bd83" stroke-opacity=".58" stroke-width="4"/>
  <path d="M330 730l42-22 39 26-6 42-43 16-37-28z" fill="#bda77a" stroke="#f0d59b" stroke-opacity=".7" stroke-width="4"/>

  <!-- Eastern merchant republic -->
  <path d="M849 213l103-34 105 24 74 75-19 94 42 71-63 89-86 19-71-51-91 1-45-74 20-90-31-69z" fill="url(#land)" stroke="#e2c58e" stroke-opacity=".66" stroke-width="5"/>
  <path d="M869 245l78 35 79-17 47 48M844 339l87-15 43 63 106 17M868 442l91-46 99 55M1000 207l-19 57 52 38 35 74" fill="none" stroke="#555046" stroke-opacity=".64" stroke-width="4"/>
  <path d="M868 245c45 28 84 38 129 30M928 507c49-24 91-24 136-3" fill="none" stroke="#f1d9a3" stroke-opacity=".24" stroke-width="3"/>

  <!-- Odren and far eastern fragments -->
  <path d="M1144 102l70-21 50 44-11 67-61 25-55-35zM1184 298l57-23 52 42-18 55-58 15-43-35zM1124 582l63-29 64 34-12 59-68 18-55-39z" fill="url(#landDark)" stroke="#cdb47e" stroke-opacity=".55" stroke-width="4"/>

  <!-- Crown: a broken belt of fog and storms -->
  <path d="M67 663c35-123 89-222 183-291 74-55 146-83 239-99" fill="none" stroke="#d9e1d4" stroke-opacity=".15" stroke-width="54" filter="url(#blur)"/>
  <path d="M63 663c38-125 92-220 187-288 72-52 144-80 237-99" fill="none" stroke="#dae1d7" stroke-opacity=".28" stroke-width="9" stroke-dasharray="18 19"/>
  <path d="M70 694c52-126 112-220 207-284 67-45 137-70 214-88" fill="none" stroke="#f0e4c3" stroke-opacity=".13" stroke-width="3" stroke-dasharray="2 19"/>

  <!-- Currents and routes -->
  <g fill="none" stroke="#a9c7c1" stroke-opacity=".24" stroke-width="3">
    <path d="M188 705c93-62 178-92 275-98 119-8 226 16 350 64"/>
    <path d="M241 156c102 79 179 145 269 202 129 81 252 122 424 139"/>
    <path d="M472 872c54-123 79-221 72-323-7-94-44-168-12-252"/>
    <path d="M656 739c91-112 172-169 278-217 83-38 170-64 267-71"/>
  </g>
  <g fill="#ead6a0" opacity=".6">
    <circle cx="514" cy="498" r="6"/><circle cx="407" cy="674" r="6"/><circle cx="246" cy="368" r="5"/><circle cx="868" cy="336" r="5"/><circle cx="1104" cy="191" r="5"/>
  </g>

  <!-- restrained cartographic lettering behind the interactive labels -->
  <g fill="#f0e2bd" opacity=".32" font-family="Georgia,serif" font-size="20" letter-spacing="5">
    <text x="92" y="835">COURONNE</text>
    <text x="520" y="925">MER DU COURANT</text>
    <text x="1010" y="650">MONDE CONNU</text>
  </g>
  <rect x="18" y="18" width="1284" height="954" rx="8" fill="none" stroke="#e6c989" stroke-opacity=".22" stroke-width="3"/>
</svg>
